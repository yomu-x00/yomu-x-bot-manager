services:
  twitter-backend:
    build: ./backend
    container_name: twitter-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Tokyo
      - DATABASE_PATH=/app/data/twitter.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    # ポートはコンテナ内のみ。CF Tunnel 経由でのみアクセス

  twitter-frontend:
    build: ./frontend
    container_name: twitter-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"        # localhost のみバインド（CF Tunnel 用）
      - "100.111.233.57:5173:80"   # Tailscale 経由アクセス用（200MBアップロード対応）
    depends_on:
      - twitter-backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - twitter-frontend
