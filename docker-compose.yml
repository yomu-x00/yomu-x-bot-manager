services:
  twitter-backend:
    build: ./backend
    container_name: twitter-backend
    restart: always
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Tokyo
      - DATABASE_PATH=/app/data/twitter.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - STALE_POST_MINUTES=${STALE_POST_MINUTES:-60}
      - POST_MAX_RETRIES=${POST_MAX_RETRIES:-3}
      - POST_RETRY_DELAY=${POST_RETRY_DELAY:-10}
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
    # ポートはコンテナ内のみ。CF Tunnel 経由でのみアクセス

  twitter-frontend:
    build: ./frontend
    container_name: twitter-frontend
    restart: always
    ports:
      - "127.0.0.1:5173:80"        # localhost のみバインド（CF Tunnel 用）
      - "100.111.233.57:5173:80"   # Tailscale 経由アクセス用（200MBアップロード対応）
    depends_on:
      - twitter-backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - twitter-frontend
