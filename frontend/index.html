<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twitter Bot Manager</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #192734;
      --surface-hover: #22303c;
      --border: #38444d;
      --text: #e7e9ea;
      --text-secondary: #8899a6;
      --primary: #1d9bf0;
      --primary-hover: #1a8cd8;
      --success: #00ba7c;
      --danger: #f4212e;
      --warning: #ffd400;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 0;
      flex-shrink: 0;
    }

    .sidebar h1 {
      font-size: 18px;
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .sidebar a {
      display: block;
      padding: 12px 20px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.15s;
    }

    .sidebar a:hover, .sidebar a.active {
      background: var(--surface-hover);
      color: var(--text);
    }

    .sidebar a.active {
      border-right: 3px solid var(--primary);
    }

    .account-bar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .account-bar select {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .account-bar select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .sidebar-sep {
      border: none;
      border-top: 1px solid var(--border);
      margin: 8px 0;
    }

    .main {
      flex: 1;
      padding: 24px 32px;
      overflow-y: auto;
    }

    .main h2 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    /* Components */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: bold;
      color: var(--primary);
    }

    .stat-card .label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
    }

    tr:hover td {
      background: var(--surface-hover);
    }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-success { background: rgba(0,186,124,0.15); color: var(--success); }
    .badge-danger { background: rgba(244,33,46,0.15); color: var(--danger); }
    .badge-warning { background: rgba(255,212,0,0.15); color: var(--warning); }
    .badge-info { background: rgba(29,155,240,0.15); color: var(--primary); }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { opacity: 0.9; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 560px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal h3 {
      margin-bottom: 16px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      cursor: pointer;
    }

    .toggle input { display: none; }

    .toggle .slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 12px;
      transition: 0.2s;
    }

    .toggle .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }

    .toggle input:checked + .slider {
      background: var(--primary);
    }

    .toggle input:checked + .slider::before {
      transform: translateX(20px);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .log-stream {
      max-height: 300px;
      overflow-y: auto;
    }

    .log-entry {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .log-entry .time {
      color: var(--text-secondary);
      margin-right: 8px;
    }

    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-bar select,
    .filter-bar input {
      padding: 6px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
    }

    /* ===== Mobile header (hidden on desktop) ===== */
    .mobile-header {
      display: none;
    }

    /* ===== Mobile (≤768px) ===== */
    @media (max-width: 768px) {
      .app {
        flex-direction: column;
      }

      /* Fixed top header */
      .mobile-header {
        display: flex;
        position: sticky;
        top: 0;
        z-index: 150;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .mobile-header .menu-btn {
        background: none;
        border: none;
        color: var(--text);
        font-size: 22px;
        cursor: pointer;
        padding: 2px 6px;
        flex-shrink: 0;
        line-height: 1;
      }

      .mobile-header .mobile-title {
        font-weight: 700;
        font-size: 16px;
        flex-shrink: 0;
      }

      .mobile-header select {
        flex: 1;
        min-width: 0;
        padding: 7px 10px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 13px;
      }

      /* Sidebar becomes a slide-in drawer */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        width: 260px;
        z-index: 200;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        overflow-y: auto;
        padding-top: 0;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      /* Account bar inside drawer is hidden on mobile (we show it in mobile-header) */
      .sidebar .account-bar {
        display: none;
      }

      .sidebar h1 {
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .sidebar-close-btn {
        display: flex !important;
        background: none;
        border: none;
        color: var(--text-secondary);
        font-size: 20px;
        cursor: pointer;
        padding: 0;
        line-height: 1;
      }

      /* Dimmed overlay behind open sidebar */
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        z-index: 190;
      }

      .sidebar-overlay.visible {
        display: block;
      }

      /* Main content: full width, less padding */
      .main {
        padding: 16px 14px;
        min-height: 0;
        flex: 1;
      }

      .main h2 {
        font-size: 18px;
        margin-bottom: 14px;
      }

      /* Tables: horizontal scroll */
      .card {
        padding: 14px 10px;
        overflow-x: auto;
      }

      table {
        min-width: 520px;
      }

      th, td {
        padding: 8px 8px;
        font-size: 13px;
      }

      /* Form rows: single column */
      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      /* Modals: bottom sheet */
      .modal-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .modal {
        width: 100%;
        max-width: 100%;
        border-radius: 20px 20px 0 0;
        max-height: 92vh;
        padding: 20px 18px;
      }

      /* Bigger touch targets */
      .btn {
        min-height: 40px;
      }

      /* Filter bar: wrap, full-width controls */
      .filter-bar {
        gap: 8px;
      }

      .filter-bar select,
      .filter-bar input {
        flex: 1;
        min-width: 120px;
      }

      /* Stat card grid: 2 columns on mobile */
      .card-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .stat-card .value {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <!-- Mobile top header (hidden on desktop via CSS) -->
  <div class="mobile-header">
    <button class="menu-btn" id="mobile-menu-btn">☰</button>
    <span class="mobile-title">Bot Manager</span>
    <select id="mobile-account-selector">
      <option value="">Loading...</option>
    </select>
  </div>

  <div class="app">
    <nav class="sidebar" id="sidebar">
      <h1>Bot Manager <button class="sidebar-close-btn" id="sidebar-close" style="display:none">✕</button></h1>
      <div class="account-bar">
        <select id="account-selector">
          <option value="">Loading...</option>
        </select>
      </div>
      <a href="#dashboard" class="active" data-page="dashboard">Dashboard</a>
      <a href="#rules" data-page="rules">Rules</a>
      <a href="#schedule" data-page="schedule">Schedule</a>
      <a href="#timeline" data-page="timeline">Timeline</a>
      <a href="#monitors" data-page="monitors">Monitors</a>
      <a href="#logs" data-page="logs">Logs</a>
      <hr class="sidebar-sep">
      <a href="#accounts" data-page="accounts">Accounts</a>
    </nav>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <main class="main" id="app"></main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
