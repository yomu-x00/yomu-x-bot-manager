<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#192734"/>

  <!-- Antenna stem -->
  <rect x="15" y="3" width="2" height="5" rx="1" fill="#1d9bf0"/>
  <!-- Antenna tip -->
  <circle cx="16" cy="3" r="2.2" fill="#1d9bf0"/>

  <!-- Robot head -->
  <rect x="5" y="8" width="22" height="16" rx="4" fill="#1d9bf0"/>

  <!-- Eyes (white circles with dark pupils) -->
  <circle cx="11.5" cy="15" r="3.5" fill="white"/>
  <circle cx="20.5" cy="15" r="3.5" fill="white"/>
  <circle cx="11.5" cy="15" r="1.8" fill="#0f1419"/>
  <circle cx="20.5" cy="15" r="1.8" fill="#0f1419"/>
  <!-- Eye shine -->
  <circle cx="12.2" cy="14.2" r="0.7" fill="white"/>
  <circle cx="21.2" cy="14.2" r="0.7" fill="white"/>

  <!-- Mouth (grid of dots) -->
  <rect x="10" y="21" width="3" height="1.5" rx="0.75" fill="white" opacity="0.85"/>
  <rect x="14.5" y="21" width="3" height="1.5" rx="0.75" fill="white" opacity="0.85"/>
  <rect x="19" y="21" width="3" height="1.5" rx="0.75" fill="white" opacity="0.85"/>
</svg>
